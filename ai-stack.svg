<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="AI stack layers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a12"/><stop offset="1" stop-color="#0c1430"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1a2547" stroke-width="1"/></pattern>
<g id="slab"><polygon points="0,0 150,-34 300,0 150,34" fill="currentColor"/><polygon points="0,0 150,34 150,48 0,14" fill="currentColor"/><polygon points="0,0 150,34 150,48 0,14" fill="#000" opacity=".42"/><polygon points="300,0 150,34 150,48 300,14" fill="currentColor"/><polygon points="300,0 150,34 150,48 300,14" fill="#000" opacity=".62"/></g>
</defs>
<rect width="900" height="420" rx="14" fill="url(#bg)"/><rect width="900" height="420" rx="14" fill="url(#grid)" opacity=".6"/>
<text x="30" y="36" font-family="Menlo,Consolas,monospace" font-size="13" fill="#22d3ee">AI stack: request path, top to bottom</text>
<g font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<!-- bottom to top so upper slabs overlap -->
<g transform="translate(40,350)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="5.4s" repeatCount="indefinite"/><use href="#slab" style="color:#065f46"/></g></g>
<g transform="translate(40,288)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="4.8s" repeatCount="indefinite"/><use href="#slab" style="color:#0e7490"/></g></g>
<g transform="translate(40,226)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-11;0,0" dur="4.2s" repeatCount="indefinite"/><use href="#slab" style="color:#6d28d9"/></g></g>
<g transform="translate(40,164)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-13;0,0" dur="3.8s" repeatCount="indefinite"/><use href="#slab" style="color:#b45309"/></g></g>
<g transform="translate(40,102)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-15;0,0" dur="3.4s" repeatCount="indefinite"/><use href="#slab" style="color:#22d3ee"/></g></g>
<g stroke-dasharray="4 6" stroke-width="1.5" fill="none"><path d="M350 102H470" stroke="#22d3ee"/><path d="M350 164H470" stroke="#fbbf24"/><path d="M350 226H470" stroke="#a78bfa"/><path d="M350 288H470" stroke="#22d3ee"/><path d="M350 350H470" stroke="#34d399"/><animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/></g>
<g fill="#e8f0ff">
<text x="480" y="98" font-size="16" font-weight="700">Interface</text><text x="480" y="118" font-size="12.5" fill="#b9c6ea">Web and mobile clients, API-first contracts</text><text x="800" y="98" font-size="11" fill="#fbbf24">in design</text>
<text x="480" y="160" font-size="16" font-weight="700">Orchestration</text><text x="480" y="180" font-size="12.5" fill="#b9c6ea">Tool calling, prompt pipelines, agent workflows</text><text x="800" y="160" font-size="11" fill="#a78bfa">researching</text>
<text x="480" y="222" font-size="16" font-weight="700">Serving</text><text x="480" y="242" font-size="12.5" fill="#b9c6ea">Python services, local LLM inference (Ollama)</text><text x="800" y="222" font-size="11" fill="#fbbf24">in design</text>
<text x="480" y="284" font-size="16" font-weight="700">Models</text><text x="480" y="304" font-size="12.5" fill="#b9c6ea">CNN training, evaluation against accuracy targets</text><text x="800" y="284" font-size="11" fill="#34d399">applied</text>
<text x="480" y="346" font-size="16" font-weight="700">Data and Infrastructure</text><text x="480" y="366" font-size="12.5" fill="#b9c6ea">Image/CSV pipelines, Azure deployment target</text><text x="800" y="346" font-size="11" fill="#34d399">applied</text>
</g></g></svg>
