<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">[YOUR_NAME] — [YOUR_ROLE]</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#101a3d"/>
      <stop offset="1" stop-color="#0a0f22"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <style>
    .sans{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .float1{animation:f1 9s ease-in-out infinite}
    .float2{animation:f2 11s ease-in-out infinite}
    .node{animation:pulse 3s ease-in-out infinite}
    .n2{animation-delay:.6s}.n3{animation-delay:1.2s}.n4{animation-delay:1.8s}.n5{animation-delay:2.4s}
    .c{opacity:0;animation:cyc 9s infinite}
    .c2{animation-delay:3s}.c3{animation-delay:6s}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,20px)}}
    @keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,-15px)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes cyc{0%{opacity:0}6%,28%{opacity:1}34%,100%{opacity:0}}
    @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      *{animation:none!important}
      .c1{opacity:1}
    }
  </style>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>

  <!-- ambient glows -->
  <circle class="float1" cx="220" cy="80" r="110" fill="#22d3ee" opacity="0.18" filter="url(#blur)"/>
  <circle class="float2" cx="980" cy="250" r="130" fill="#a78bfa" opacity="0.22" filter="url(#blur)"/>

  <!-- node network -->
  <g stroke="url(#ac)" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <polyline points="860,80 960,150 900,235 1040,250"/>
    <polyline points="960,150 1080,95 1150,170 1040,250"/>
    <polyline points="1080,95 1040,250"/>
  </g>
  <g fill="url(#ac)">
    <circle class="node" cx="860" cy="80" r="6"/>
    <circle class="node n2" cx="960" cy="150" r="8"/>
    <circle class="node n3" cx="900" cy="235" r="5"/>
    <circle class="node n4" cx="1080" cy="95" r="6"/>
    <circle class="node n5" cx="1150" cy="170" r="5"/>
    <circle class="node n2" cx="1040" cy="250" r="7"/>
  </g>

  <!-- glass frame -->
  <rect x="14" y="14" width="1172" height="292" rx="16" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- text -->
  <text x="60" y="78" class="mono" font-size="15" fill="#7dd3fc" letter-spacing="2">// [YOUR_SPECIALIZATION]</text>
  <text x="60" y="152" class="sans" font-size="64" font-weight="800" fill="url(#ac)">[YOUR_NAME]</text>
  <text x="60" y="196" class="sans" font-size="24" font-weight="500" fill="#e2e8f0">[YOUR_ROLE]</text>

  <g class="mono" font-size="18" fill="#94a3b8">
    <text class="c c1" x="60" y="244">&gt; [LINE_ONE: what you build]<tspan class="cursor" fill="#22d3ee">▍</tspan></text>
    <text class="c c2" x="60" y="244">&gt; [LINE_TWO: what you're exploring]<tspan class="cursor" fill="#22d3ee">▍</tspan></text>
    <text class="c c3" x="60" y="244">&gt; [LINE_THREE: your tagline]<tspan class="cursor" fill="#22d3ee">▍</tspan></text>
  </g>

  <text x="60" y="284" class="mono" font-size="13" fill="#64748b" letter-spacing="1">[TECH_1] · [TECH_2] · [TECH_3] · [TECH_4]</text>
</svg>
