<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Hospital ERP reference architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a12"/><stop offset="1" stop-color="#0c1430"/></linearGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1a2547" stroke-width="1"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#22d3ee"/></marker>
</defs>
<rect width="900" height="420" rx="14" fill="url(#bg)"/><rect width="900" height="420" rx="14" fill="url(#grid)" opacity=".6"/>
<text x="30" y="36" font-family="Menlo,Consolas,monospace" font-size="13" fill="#22d3ee">Hospital ERP / HIS: reference architecture (design phase)</text>
<rect x="290" y="60" width="580" height="330" rx="14" fill="none" stroke="#a78bfa" stroke-opacity=".6" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" values="0;-28" dur="2s" repeatCount="indefinite"/></rect>
<text x="306" y="84" font-family="Menlo,Consolas,monospace" font-size="12" fill="#a78bfa">Azure boundary</text>
<g font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" fill="#e8f0ff" font-size="14" font-weight="700" text-anchor="middle">
<g><animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="5s" repeatCount="indefinite"/>
<rect x="40" y="160" width="190" height="100" rx="12" fill="#0e1736" stroke="#22d3ee"/><text x="135" y="204">Clients</text><text x="135" y="228" font-size="12" font-weight="400" fill="#b9c6ea">Frontend repo (separate)</text></g>
<g><animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="4.4s" repeatCount="indefinite"/>
<rect x="340" y="160" width="200" height="100" rx="12" fill="#0e1736" stroke="#fbbf24"/><text x="440" y="204">Backend API</text><text x="440" y="228" font-size="12" font-weight="400" fill="#b9c6ea">Auth, domain services</text></g>
<g><animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="5.6s" repeatCount="indefinite"/>
<rect x="650" y="110" width="190" height="90" rx="12" fill="#0e1736" stroke="#34d399"/><text x="745" y="150">Database</text><text x="745" y="174" font-size="12" font-weight="400" fill="#b9c6ea">Patient and ops records</text></g>
<g><animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="4.8s" repeatCount="indefinite"/>
<rect x="650" y="250" width="190" height="100" rx="12" fill="#0e1736" stroke="#a78bfa"/><text x="745" y="294">LLM Service</text><text x="745" y="318" font-size="12" font-weight="400" fill="#b9c6ea">Ollama, local models</text></g>
</g>
<g fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#ar)">
<path id="p1" d="M232 210H338"/><path id="p2" d="M542 190C590 190 600 160 648 158"/><path id="p3" d="M542 230C590 230 600 296 648 300"/></g>
<g fill="#fff" filter="url(#glow)">
<circle r="4"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
<circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
<circle r="4"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle></g>
<g font-family="Menlo,Consolas,monospace" font-size="11.5" fill="#8ea0c8"><text x="40" y="330">Design target: fewer than 1,000 users</text><text x="40" y="352">Inference stays inside the boundary</text><text x="40" y="374">Team of 3, two repositories</text></g>
</svg>
